title: "Pipe BOP\nCalculator"

tooltip: |
  Calculates pipe Bottom-of-Pipe (BOP) elevations for tagging and scheduling.

  Features:
  • Creates the BOP_Start and BOP_End length parameters when needed.
  • Reads Revit's Lower End Bottom Elevation to retain the elevation datum shown in Properties.
  • Calculates BOP_Start at the upper end and BOP_End at the lower end.
  • Supports flat and sloped pipes in the current selection or active view.

  How to use:
  1. Optionally select one or more pipes.
  2. Run the command.
  3. Review the result table and any reported errors.

author: "Permpong Thaweekul (P13)"
description: "Calculate upper and lower pipe Bottom-of-Pipe elevations for tagging and scheduling."
