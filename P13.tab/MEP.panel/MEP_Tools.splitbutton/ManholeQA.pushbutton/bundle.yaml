title: "MH Connection QA"

tooltip: |
  Manhole QA and Connection Sync Tool.

  Key features:
  - Scans electrical equipment manholes and conduits in the active view.
  - Calculates main and extra connection depths by side.
  - Shows CNT_Number and CNT_Zone in the QA table and CSV export.
  - Provides modeless review UI with search, select, focus, isolate, commit, and export.
  - Runs fully from script.py without Dynamo graph dependencies.

author: "OHM"
description: "Scan, review, and sync manhole conduit connections via a modeless QA UI."

engine:
  persistent: true
  full_frame: true
