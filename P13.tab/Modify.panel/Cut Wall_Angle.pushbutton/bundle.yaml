title: "Cut Wall\nAngle"

tooltip: |
  Cuts a wall at an angle with a line-based Void Family in the Structural Connections category.
  The command uses InstanceVoidCutUtils, preserving the selected wall's parameters.


description: "Quickly cut walls at any angle using a line-based Void family in the Structural Connections category."
author: "Permpong Taweekul (P13)"
