title: "Overkill\nView"

tooltip: |
  Remove duplicate and overlapping annotations from the active view.

  Key features:
  - Clean lines, dimensions, tags, and text notes together or process one category only.
  - Merge collinear Detail Lines, Model Lines, and Room Separation Lines.
  - Remove duplicate dimensions only when their position, type, and references match.
  - Remove duplicate tags only when their target, position, and type match.
  - Remove duplicate text notes only when content, formatting, position, and leaders match.
  - Optionally preserve line-weight differences while evaluating overlapping lines.
  - Report the number of removed lines, dimensions, tags, and text notes after cleanup.

  Scope: Entire active view.

author: "P13"
description: "Remove duplicate lines, dimensions, tags, and text notes from the active view."
