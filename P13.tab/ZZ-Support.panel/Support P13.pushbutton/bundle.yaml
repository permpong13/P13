tooltip: |
  [EN] Support P13.extension & Share Tool Ideas
  P13.extension is 100% free and open-source for everyone.
  If these tools save you time at work, consider buying Tee a coffee!

  - Worldwide (Card / Apple Pay / Google Pay): Ko-fi & GitHub Sponsors
  - Mobile QR Scan: Ko-fi QR (Worldwide) & PromptPay QR (Thailand / ASEAN)
  - Share Workflow Ideas: Suggest repetitive Revit tasks for future updates

  Shift+Click: Open Ko-fi page directly in browser
  ------------------------------------------------------------
  [TH] สนับสนุนการพัฒนา P13.extension และเสนอไอเดียเครื่องมือใหม่
  ชุดเครื่องมือ P13 เปิดให้ใช้งานฟรี 100% หากช่วยประหยัดเวลาทำงานของคุณ
  สามารถร่วมสนับสนุนค่ากาแฟหรือส่งไอเดียคำสั่งใหม่ที่อยากให้พัฒนาต่อได้ครับ

  - ต่างประเทศ / บัตรเครดิต / Apple Pay / Google Pay: Ko-fi และ GitHub Sponsors
  - สแกนจ่ายผ่านมือถือ: Ko-fi QR (ทั่วโลก) และ PromptPay QR (ไทย / อาเซียน)