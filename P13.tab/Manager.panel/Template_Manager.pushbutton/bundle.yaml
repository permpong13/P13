title: "Template\nManager"
# Thai reference: จัดการ View Template

tooltip: |
  Audit, manage, compare, apply, import, and export Revit view templates from one professional workspace.

  Features:
  - Usage Dashboard: Show total, in-use, unused, selected, linked-view, and controlled-parameter counts.
  - Live Discovery: Search by name, type, status, or Element ID and filter by usage status and view type.
  - Safe Batch Actions: Duplicate, rename, and delete unused templates with conflict checks, previews, rollback, and result counts.
  - Compatible Apply: Apply one template only to compatible views selected by the user.
  - Parameter Control: Include or exclude all available template parameters in a validated batch operation.
  - Audit Tools: List linked views and compare parameter differences between two templates.
  - Project Exchange: Import non-conflicting templates from another open Revit project.
  - UTF-8 CSV Audit: Export complete template usage reports and remember the selected folder.
  - Dark Futuristic UI: Use a resizable Windows-style interface with draggable header and standard window controls.
# Thai reference: ตรวจสอบจำนวนการใช้งาน ค้นหาและกรอง Template; Duplicate/Rename/Delete แบบปลอดภัย; Apply เฉพาะ View ที่รองรับ; จัดการ Include/Exclude Parameters; เปรียบเทียบค่า; Import จาก Project ที่เปิดอยู่; Export รายงาน CSV UTF-8 พร้อมจำโฟลเดอร์; UI Dark แบบ Windows

author: "P13"
# Thai reference: ผู้พัฒนา P13
description: "Professional Revit view template auditing, batch management, application, exchange, and reporting."
# Thai reference: เครื่องมือระดับ Pro สำหรับตรวจสอบ จัดการ ใช้งาน แลกเปลี่ยน และออกรายงาน View Template ของ Revit
