title: "A-Sync\nUpdate"

tooltip: |
  Update the P13.extension toolset to the latest GitHub version.

  Key features:
  - Downloads the latest tools from the configured GitHub repository.
  - Hidden for admin/developer users to prevent accidental source overwrite.
  - Copies files safely and skips locked files.
  - Reloads pyRevit after the update completes.

author: "P13"
description: "Sync and update P13 tools from GitHub Cloud with automatic pyRevit reload."
