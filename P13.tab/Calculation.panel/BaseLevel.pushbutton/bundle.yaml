title: "Base_Level\nParameter"

tooltip: |
  🇬🇧 [EN] "Base_Level Parameter" is a pyRevit command to automatically set the 'Base_Level', 'CNT_Base Level', or custom parameter for elements using the elevation value of their host Level.
  Key Features:
  • Allows selecting target parameter ('Base_Level', 'CNT_Base Level', or custom).
  • Supports running on selected elements or entire model.
  • Detects the host Level of each element (Structural, Architectural, MEP).
  • Reads Elevation value and formats accurately (Length, Number, or Text in meters).
  • Safely preserves all existing parameters and data.
  
  🇹🇭 [TH] “Base_Level Parameter” คือคำสั่ง pyRevit สำหรับตั้งค่าระดับความสูง Level ลงใน Parameter ปลายทาง (เช่น ‘Base_Level’, ‘CNT_Base Level’ หรือระบุเอง)
  ฟังก์ชันหลัก:
  • เลือกระบุ Parameter ปลายทางได้ตามต้องการ
  • เลือกประมวลผลเฉพาะชิ้นที่เลือก หรือทั้งโปรเจคได้
  • ตรวจจับ Level ได้แม่นยำ ครอบคลุมทั้งงานโครงสร้าง สถาปัตย์ และระบบ MEP
  • รองรับ Data Type ทั้ง Length, Number และ Text (ทศนิยม 3 ตำแหน่ง)
  • ปลอดภัย ไม่ลบพารามิเตอร์หรือข้อมูลเดิมในโมเดล

author: "เพิ่มพงษ์ ทวีกุล (P13)"
description: "Set Level elevation into Base_Level / CNT_Base Level parameter. / ตั้งค่าระดับความสูง Level ลงในพารามิเตอร์อัตโนมัติ"