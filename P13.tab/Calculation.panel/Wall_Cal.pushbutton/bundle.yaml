title: "Wall\nCal"

tooltip: |
  Calculate and update wall elevation parameters for Revit 2026.
  The command also loads "Wall Tag by P13.rfa" when needed and sets its
  preferred wall tag type as the project default.

  Calculations:
  - Top of Wall = Base Elevation + Base Offset + Unconnected Height
  - Level_Bottom_of_Column = Base Elevation + Base Offset

  Updated parameters:
  1. Top of Wall
  2. Level_Bottom_of_Column
  3. Base_Level (created as a shared parameter when missing)

author: "Permpong Taweekul (P13)"
description: "Calculate wall elevations, update wall parameters, and configure the P13 wall tag as the project default."
