title: "Door\nCal"

tooltip: |
  Calculate and update door elevation parameters for Revit 2026.
  The command also loads "Door_Tag_By_P13.rfa" when needed and sets one
  of its door tag types as the project default.

  Calculations:
  - Top of Door = Base Elevation + Sill Height + Door Height
  - Bottom of Door = Base Elevation + Sill Height

  Updated parameters:
  1. Top of Door
  2. Bottom of Door
  3. Base_Level (created as a shared parameter when missing)

author: "Permpong Taweekul (P13)"
description: "Calculate door elevations, update door parameters, and configure the P13 door tag as the project default."
