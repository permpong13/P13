title: "Windows\nCal"

tooltip: |
  Calculate and update window elevation parameters for Revit 2026.
  The command also loads "Windows_Tag_By_P13.rfa" when needed and sets
  one of its window tag types as the project default.

  Calculations:
  - Top of Windows = Base Elevation + Sill Height + Window Height
  - Bottom of Windows = Base Elevation + Sill Height

  Updated parameters:
  1. Top of Windows
  2. Bottom of Windows
  3. Base_Level (created as a shared parameter when missing)

author: "Permpong Taweekul (P13)"
description: "Calculate window elevations, update window parameters, and configure the P13 window tag as the project default."
