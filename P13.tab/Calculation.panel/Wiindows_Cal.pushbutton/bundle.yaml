title: "Windows\nCal"

tooltip: |
  🇬🇧 [EN] Calculate and update window elevation parameters (Fixed for Revit 2026).
  Calculation Formulas:
  • Top of Windows    = Base Elevation + Sill Height + Window Height
  • Bottom of Windows = Base Elevation + Sill Height

  Updated Parameters:
  1. Top of Windows
  2. Bottom of Windows
  3. Base_Level (Auto-generates Shared Parameters if missing)

  🇹🇭 [TH] คำนวณและอัปเดตพารามิเตอร์ระดับความสูงของหน้าต่าง (Fixed Version สำหรับ Revit 2026)
  สูตรการคำนวณ:
  • Top of Windows    = Base Elevation + Sill Height + Window Height
  • Bottom of Windows = Base Elevation + Sill Height

  พารามิเตอร์ที่อัปเดต:
  1. Top of Windows
  2. Bottom of Windows
  3. Base_Level (ตรวจสอบและสร้าง Shared Parameter อัตโนมัติหากไม่มี)

author: "เพิ่มพงษ์ ทวีกุล (P13)"
description: "Calculate window elevations and update parameters based on Level, Sill Height and Window Height. / รวบรวมหน้าต่างทั้งหมดเพื่อคำนวณและเขียนค่าระดับความสูงลงใน Parameter"
