title: "CSV to\nFamilies"

tooltip: |
  [EN]
  Import or update 3D Structural Piles, Foundations, and Columns from CSV survey coordinates.
  - Supports Shared/Survey Coordinates (UTM), Project Base Point, and Internal Origin.
  - Smart Upsert mode updates existing piles by Mark/Number without creating duplicates.
  - Live CSV table preview, flexible column mapping, Cut-Off elevation offset, and rotation control.
  - 100% 3D Model Family filter (blocks 2D Detail Items automatically).

  [TH]
  นำเข้าหรืออัปเดตเสาเข็มและฐานราก 3D จากไฟล์พิกัดสำรวจ CSV
  - รองรับพิกัดสำรวจจริง (Survey/UTM), Project Base Point และหน่วย m / mm / ft
  - โหมด Smart Upsert อัปเดตตำแหน่งและระดับหัวเข็มตัวเดิมตามชื่อเข็มโดยไม่สร้างซ้อนทับ
  - มีตารางพรีวิวข้อมูลสด เลือกจับคู่คอลัมน์อิสระ คำนวณระดับตัดหัวเข็ม (Cut-Off) และมุมหมุนอัตโนมัติ
author: "เพิ่มพงษ์ ทวีกุล (P13)"

description: "Import Families from CSV with E/N coordinate transformation, dynamic parameter mapping, auto-type matching, and macOS-style UI. / นำเข้า Families จาก CSV พร้อมระบบแปลงพิกัด เลือกพารามิเตอร์อิสระ และหน้าต่าง UI สไตล์ macOS"